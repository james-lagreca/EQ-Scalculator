<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQ Scaling Calculator</title>
    
    <!-- Load PyScript & Plotly -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

    <style>
        body { font-family: -apple-system, sans-serif; background: #f0f2f6; padding: 20px; color: #31333F; max-width: 900px; margin: 0 auto; }
        .card { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h1 { margin-top: 0; color: #0e1117; }
        
        /* TABS STYLING */
        .tab { overflow: hidden; border-bottom: 1px solid #ccc; margin-bottom: 20px; }
        .tab button { background-color: inherit; float: left; border: none; outline: none; cursor: pointer; padding: 10px 20px; font-size: 16px; font-weight: bold; color: #555; }
        .tab button:hover { background-color: #ddd; border-radius: 5px 5px 0 0; }
        .tab button.active { color: #ff4b4b; border-bottom: 3px solid #ff4b4b; }
        .tabcontent { display: none; animation: fadeEffect 0.5s; }
        @keyframes fadeEffect { from {opacity: 0;} to {opacity: 1;} }

        /* INPUTS */
        label { display: block; margin-top: 15px; font-weight: 600; font-size: 0.9rem; }
        select, input { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #d6d6d6; border-radius: 5px; box-sizing: border-box; }
        .row { display: flex; gap: 15px; }
        .col { flex: 1; }

        /* BUTTONS & RESULTS */
        button.action-btn { width: 100%; background-color: #ff4b4b; color: white; border: none; padding: 12px; border-radius: 5px; margin-top: 25px; font-size: 1rem; cursor: pointer; font-weight: bold; }
        button.action-btn:hover { background-color: #ff3333; }
        .result-box { margin-top: 20px; padding: 15px; background: #e8f0fe; border-radius: 5px; display: none; border-left: 5px solid #4ea8de; }
        .error-box { margin-top: 20px; padding: 15px; background: #ffe8e8; color: #b00; border-radius: 5px; display: none; border-left: 5px solid #ff4b4b; }
        .info-text { font-size: 0.85rem; color: #666; margin-top: 5px; }
    </style>

    <!-- INLINE CONFIGURATION (Strict JSON: No comments, no trailing commas) -->
    <script type="json" id="pyscript-config">
    {
        "packages": ["pandas", "numpy", "scipy", "plotly"],
        "fetch": [
            {
                "from": "_core",
                "to_folder": "_core",
                "files": ["logic.py", "helpers.py"] 
            },
            {
                "from": "scaling_models/leonard_2014",
                "to_folder": "scaling_models/leonard_2014",
                "files": ["leonard_2014.json"]
            },
            {
                "from": "scaling_models/somerville_2014",
                "to_folder": "scaling_models/somerville_2014",
                "files": ["somerville_2014.json"]
            },
            {
                "from": "scaling_models/wells_coppersmith_1994",
                "to_folder": "scaling_models/wells_coppersmith_1994",
                "files": ["wells_coppersmith_1994.json"]
            },
            {
                "from": "scaling_models/yang_etal_2020",
                "to_folder": "scaling_models/yang_etal_2020",
                "files": ["yang_2020.json"]
            }
        ]
    }
    </script>
</head>
<body>

    <h1>EQ Calculator</h1>

    <!-- TABS NAVIGATION -->
    <div class="tab">
        <button class="tablinks active" onclick="openTab(event, 'Deterministic')">Deterministic</button>
        <button class="tablinks" onclick="openTab(event, 'MonteCarlo')">Monte Carlo</button>
        <button class="tablinks" onclick="openTab(event, 'Explore')">Explore / Plots</button>
    </div>

    <!-- TAB 1: DETERMINISTIC -->
    <div id="Deterministic" class="tabcontent" style="display: block;">
        <div class="card">
            <h3>Calculate Single Value</h3>
            
            <div class="row">
                <div class="col">
                    <label>Input Parameter (X)</label>
                    <select id="input_var_det" class="param-selector">
                        <option value="Mw">Mw</option>
                        <option value="A">Area (A)</option>
                        <option value="L">Length (L)</option>
                        <option value="W">Width (W)</option>
                        <option value="AD">Avg Displacement (AD)</option>
                        <option value="MD">Max Displacement (MD)</option>
                        <option value="M0">Moment (M0)</option>
                    </select>
                </div>
                <div class="col">
                    <label>Output Parameter (Y)</label>
                    <select id="output_var_det" class="param-selector">
                        <option value="A">Area (A)</option>
                        <option value="Mw">Mw</option>
                        <option value="L">Length (L)</option>
                        <option value="W">Width (W)</option>
                        <option value="AD">Avg Displacement (AD)</option>
                        <option value="MD">Max Displacement (MD)</option>
                        <option value="M0">Moment (M0)</option>
                    </select>
                </div>
            </div>

            <label>Select Model & Relationship</label>
            <select id="model_select_det"></select>
            <div class="info-text">If empty, no model exists for this X -> Y combination.</div>

            <div class="row">
                <div class="col">
                    <label>Input Value</label>
                    <input type="number" id="input_val_det" value="6.5" step="0.1">
                </div>
                <div class="col">
                    <label>Input Unit</label>
                    <select id="input_unit_det"></select>
                </div>
            </div>
            
            <div class="row">
                <div class="col">
                    <label>Target Output Unit</label>
                    <select id="output_unit_det"></select>
                </div>
            </div>

            <button class="action-btn" py-click="calculate_deterministic">Calculate</button>
            
            <div id="res_det" class="result-box"></div>
            <div id="err_det" class="error-box"></div>
        </div>
    </div>

    <!-- TAB 2: MONTE CARLO -->
    <div id="MonteCarlo" class="tabcontent">
        <div class="card">
            <h3>Monte Carlo Simulation</h3>
            
            <div class="row">
                <div class="col">
                    <label>Input Parameter</label>
                    <select id="input_var_mc" class="param-selector">
                        <option value="Mw">Mw</option>
                        <option value="A">Area (A)</option>
                        <option value="L">Length (L)</option>
                    </select>
                </div>
                <div class="col">
                    <label>Output Parameter</label>
                    <select id="output_var_mc" class="param-selector">
                        <option value="A">Area (A)</option>
                        <option value="Mw">Mw</option>
                        <option value="L">Length (L)</option>
                    </select>
                </div>
            </div>

            <label>Select Model</label>
            <select id="model_select_mc"></select>

            <div class="row">
                <div class="col">
                    <label>Mean Input Value</label>
                    <input type="number" id="input_val_mc" value="6.5">
                </div>
                <div class="col">
                    <label>Std Dev / Error</label>
                    <input type="number" id="input_unc_mc" value="0.1">
                </div>
            </div>
            
            <div class="row">
                <div class="col">
                    <label>Input Unit</label>
                    <select id="input_unit_mc"></select>
                </div>
                <div class="col">
                    <label>Output Unit</label>
                    <select id="output_unit_mc"></select>
                </div>
            </div>

            <label>Number of Simulations</label>
            <input type="number" id="sim_count" value="1000">

            <button class="action-btn" py-click="run_monte_carlo">Run Simulation</button>
            
            <div id="mc_plot_area" style="margin-top: 20px;"></div>
            <div id="err_mc" class="error-box"></div>
        </div>
    </div>

    <!-- TAB 3: EXPLORE -->
    <div id="Explore" class="tabcontent">
        <div class="card">
            <h3>Plot Scaling Curves</h3>
            <div class="row">
                <div class="col">
                    <label>X-Axis Parameter</label>
                    <select id="input_var_plot" class="param-selector">
                        <option value="Mw">Mw</option>
                        <option value="A">Area (A)</option>
                        <option value="L">Length (L)</option>
                    </select>
                </div>
                <div class="col">
                    <label>Y-Axis Parameter</label>
                    <select id="output_var_plot" class="param-selector">
                        <option value="A">Area (A)</option>
                        <option value="Mw">Mw</option>
                        <option value="L">Length (L)</option>
                    </select>
                </div>
            </div>

            <label>Select Model</label>
            <select id="model_select_plot"></select>
            
            <button class="action-btn" py-click="plot_curve">Generate Curve</button>
            <div id="curve_plot_area" style="margin-top: 20px;"></div>
        </div>
    </div>

    <!-- JAVASCRIPT FOR TABS -->
    <script>
        function openTab(evt, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tabcontent");
            for (i = 0; i < tabcontent.length; i++) { tabcontent[i].style.display = "none"; }
            tablinks = document.getElementsByClassName("tablinks");
            for (i = 0; i < tablinks.length; i++) { tablinks[i].className = tablinks[i].className.replace(" active", ""); }
            document.getElementById(tabName).style.display = "block";
            evt.currentTarget.className += " active";
        }
    </script>

    <!-- PYTHON LOGIC -->
    <script type="py" config="pyscript-config">
        import json
        import js
        import os
        import numpy as np
        import pandas as pd
        import plotly.express as px
        import plotly.io as pio
        from pyodide.ffi import create_proxy
        
        from _core.logic import solve_relationship, solve_one_simulation_run, calculate_curve
        from _core.helpers import convert_units

        # --- CONFIGURATION ---
        PARAMETER_ALIASES = {'L': 'L', 'W': 'W', 'A': 'A', 'D': 'AD', 'AD': 'AD', 'MD': 'MD', 'M0': 'M0', 'Mw': 'Mw', 'SRL': 'SRL', 'L_SR': 'SRL'}
        UNIT_OPTIONS = {
            'A': ['km^2', 'm^2'], 'L': ['km', 'm'], 'W': ['km', 'm'], 'SRL': ['km', 'm'],
            'AD': ['m'], 'MD': ['m'], 'Mw': ['N/A'], 'M0': ['Nm', 'dyne.cm']
        }
        
        loaded_models = {}
        model_config = {
            "leonard_2014": "leonard_2014.json",
            "somerville_2014": "somerville_2014.json",
            "wells_coppersmith_1994": "wells_coppersmith_1994.json",
            "yang_etal_2020": "yang_2020.json"
        }

        def get_model_data_root(data):
            if 'fault_types' in data: return data
            for key, val in data.items():
                if isinstance(val, dict) and 'fault_types' in val: return val
            return None

        def load_data():
            for folder_name, file_name in model_config.items():
                path = f"scaling_models/{folder_name}/{file_name}"
                if os.path.exists(path):
                    with open(path, 'r') as f:
                        loaded_models[folder_name] = json.load(f)
            
            # Initial Population
            refresh_options("det")
            refresh_options("mc")
            refresh_options("plot")

        def refresh_options(mode):
            # 1. Get Selected Inputs/Outputs
            in_var = js.document.getElementById(f"input_var_{mode}").value
            out_var = js.document.getElementById(f"output_var_{mode}").value
            
            # 2. Populate Unit Dropdowns
            in_units = UNIT_OPTIONS.get(in_var, ['N/A'])
            out_units = UNIT_OPTIONS.get(out_var, ['N/A'])
            
            if mode != "plot":
                # Populate Input Unit
                u_sel = js.document.getElementById(f"input_unit_{mode}")
                u_sel.innerHTML = ""
                for u in in_units:
                    opt = js.document.createElement("option")
                    opt.text = u
                    opt.value = u
                    u_sel.add(opt)
                
                # Populate Output Unit
                if mode == "det" or mode == "mc":
                    out_u_sel = js.document.getElementById(f"output_unit_{mode}") if mode == "mc" else js.document.getElementById("output_unit_det")
                    out_u_sel.innerHTML = ""
                    for u in out_units:
                        opt = js.document.createElement("option")
                        opt.text = u
                        opt.value = u
                        out_u_sel.add(opt)

            # 3. Find Matching Models
            model_select = js.document.getElementById(f"model_select_{mode}")
            model_select.innerHTML = ""
            
            input_aliases = [in_var, 'SRL'] if in_var == 'L' else [in_var]
            output_aliases = [out_var, 'SRL'] if out_var == 'L' else [out_var]

            count = 0
            for m_name, data in loaded_models.items():
                root = get_model_data_root(data)
                if not root: continue
                
                for f_type, rels in root['fault_types'].items():
                    for rel_key in rels.keys():
                        # Parse Key: "A_from_L" -> Y=A, X=L
                        try:
                            y_param, x_param = rel_key.split('_from_')
                            y_can = PARAMETER_ALIASES.get(y_param, y_param)
                            x_can = PARAMETER_ALIASES.get(x_param, x_param)
                            
                            direction = None
                            # Forward: Input matches X, Output matches Y
                            if x_can in input_aliases and y_can in output_aliases:
                                direction = 'forward'
                            # Inverse: Input matches Y, Output matches X
                            elif y_can in input_aliases and x_can in output_aliases:
                                direction = 'inverse'
                            
                            if direction:
                                opt = js.document.createElement("option")
                                nice_name = m_name.replace("_", " ").title()
                                opt.text = f"{nice_name} | {f_type} : {rel_key}"
                                # Store complex ID: "model_key|fault_type|rel_key|direction"
                                opt.value = f"{m_name}|{f_type}|{rel_key}|{direction}"
                                model_select.add(opt)
                                count += 1
                        except: pass
            
            if count == 0:
                opt = js.document.createElement("option")
                opt.text = "No matching models found"
                model_select.add(opt)

        # Event Listeners
        def on_param_change_det(e): refresh_options("det")
        def on_param_change_mc(e): refresh_options("mc")
        def on_param_change_plot(e): refresh_options("plot")

        js.document.getElementById("input_var_det").addEventListener("change", create_proxy(on_param_change_det))
        js.document.getElementById("output_var_det").addEventListener("change", create_proxy(on_param_change_det))
        
        js.document.getElementById("input_var_mc").addEventListener("change", create_proxy(on_param_change_mc))
        js.document.getElementById("output_var_mc").addEventListener("change", create_proxy(on_param_change_mc))

        js.document.getElementById("input_var_plot").addEventListener("change", create_proxy(on_param_change_plot))
        js.document.getElementById("output_var_plot").addEventListener("change", create_proxy(on_param_change_plot))

        # --- CALCULATION LOGIC ---
        def calculate_deterministic(e):
            try:
                sel_val = js.document.getElementById("model_select_det").value
                if "|" not in sel_val: raise ValueError("No valid model selected.")
                
                m_name, f_type, r_key, direction = sel_val.split("|")
                
                val = float(js.document.getElementById("input_val_det").value)
                in_unit = js.document.getElementById("input_unit_det").value
                target_unit = js.document.getElementById("output_unit_det").value
                
                root = get_model_data_root(loaded_models[m_name])
                params = root['fault_types'][f_type][r_key]
                
                res, res_unit = solve_relationship(params, val, in_unit, direction)
                
                if res is None: raise ValueError(f"Calculation Error: {res_unit}")
                
                # Convert Output if needed
                if target_unit != 'N/A' and res_unit and res_unit != target_unit:
                    res = convert_units(res, res_unit, target_unit)
                    res_unit = target_unit

                out_div = js.document.getElementById("res_det")
                out_div.style.display = "block"
                out_div.innerText = f"Result: {res:.4f} {res_unit}"
                js.document.getElementById("err_det").style.display = "none"
            except Exception as ex:
                js.document.getElementById("err_det").style.display = "block"
                js.document.getElementById("err_det").innerText = str(ex)

        def run_monte_carlo(e):
            try:
                sel_val = js.document.getElementById("model_select_mc").value
                if "|" not in sel_val: raise ValueError("No valid model selected.")
                m_name, f_type, r_key, direction = sel_val.split("|")
                
                mean = float(js.document.getElementById("input_val_mc").value)
                std = float(js.document.getElementById("input_unc_mc").value)
                in_unit = js.document.getElementById("input_unit_mc").value
                target_unit = js.document.getElementById("output_unit_mc").value
                sims = int(js.document.getElementById("sim_count").value)
                
                root = get_model_data_root(loaded_models[m_name])
                params = root['fault_types'][f_type][r_key]
                
                results = []
                for _ in range(sims):
                    iter_val = np.random.normal(mean, std)
                    res, u = solve_one_simulation_run(params, iter_val, in_unit, direction, True)
                    if res:
                        if target_unit != 'N/A' and u and u != target_unit:
                            res = convert_units(res, u, target_unit)
                        results.append(res)
                
                if not results: raise ValueError("No valid results.")
                
                df = pd.DataFrame({'Result': results})
                fig = px.histogram(df, x='Result', nbins=30, title="Monte Carlo Distribution")
                graphJSON = json.dumps(fig.to_dict(), cls=pio.utils.PlotlyJSONEncoder)
                js.Plotly.newPlot("mc_plot_area", js.JSON.parse(graphJSON))
                js.document.getElementById("err_mc").style.display = "none"
            except Exception as ex:
                js.document.getElementById("err_mc").style.display = "block"
                js.document.getElementById("err_mc").innerText = str(ex)

        def plot_curve(e):
            try:
                sel_val = js.document.getElementById("model_select_plot").value
                if "|" not in sel_val: raise ValueError("No valid model selected.")
                m_name, f_type, r_key, direction = sel_val.split("|")
                
                root = get_model_data_root(loaded_models[m_name])
                params = root['fault_types'][f_type][r_key]
                
                # Determine X-range based on input var (simple heuristic)
                in_var = js.document.getElementById("input_var_plot").value
                in_unit = UNIT_OPTIONS.get(in_var, ['N/A'])[0] # Default to first unit
                
                if in_var == 'Mw': x_vals = np.linspace(4.0, 9.0, 50)
                elif in_var == 'A': x_vals = np.logspace(1, 5, 50) # 10 to 100,000 km2
                elif in_var == 'L': x_vals = np.logspace(0, 3, 50) # 1 to 1000 km
                else: x_vals = np.linspace(1, 100, 50)

                y_vals, y_unit = calculate_curve(params, x_vals, in_unit, direction)
                
                df = pd.DataFrame({'X': x_vals, 'Y': y_vals})
                fig = px.line(df, x='X', y='Y', title=f"{r_key} Scaling Curve")
                
                graphJSON = json.dumps(fig.to_dict(), cls=pio.utils.PlotlyJSONEncoder)
                js.Plotly.newPlot("curve_plot_area", js.JSON.parse(graphJSON))
            except Exception as ex:
                js.alert(str(ex))

        load_data()

    </script>
</body>
</html>
