<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQ Scaling Calculator</title>
    
    <!-- Load PyScript & Plotly -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

    <style>
        body { font-family: -apple-system, sans-serif; background: #f0f2f6; padding: 20px; color: #31333F; max-width: 900px; margin: 0 auto; }
        .card { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h1 { margin-top: 0; color: #0e1117; }
        
        /* TABS STYLING */
        .tab { overflow: hidden; border-bottom: 1px solid #ccc; margin-bottom: 20px; }
        .tab button { background-color: inherit; float: left; border: none; outline: none; cursor: pointer; padding: 10px 20px; font-size: 16px; font-weight: bold; color: #555; }
        .tab button:hover { background-color: #ddd; border-radius: 5px 5px 0 0; }
        .tab button.active { color: #ff4b4b; border-bottom: 3px solid #ff4b4b; }
        .tabcontent { display: none; animation: fadeEffect 0.5s; }
        @keyframes fadeEffect { from {opacity: 0;} to {opacity: 1;} }

        /* INPUTS */
        label { display: block; margin-top: 15px; font-weight: 600; font-size: 0.9rem; }
        select, input { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #d6d6d6; border-radius: 5px; box-sizing: border-box; }
        .row { display: flex; gap: 15px; }
        .col { flex: 1; }

        /* BUTTONS & RESULTS */
        button.action-btn { width: 100%; background-color: #ff4b4b; color: white; border: none; padding: 12px; border-radius: 5px; margin-top: 25px; font-size: 1rem; cursor: pointer; font-weight: bold; }
        button.action-btn:hover { background-color: #ff3333; }
        .result-box { margin-top: 20px; padding: 15px; background: #e8f0fe; border-radius: 5px; display: none; border-left: 5px solid #4ea8de; }
        .error-box { margin-top: 20px; padding: 15px; background: #ffe8e8; color: #b00; border-radius: 5px; display: none; border-left: 5px solid #ff4b4b; }
    </style>

    <!-- INLINE CONFIGURATION -->
    <script type="json" id="pyscript-config">
    {
        "packages": ["pandas", "numpy", "scipy", "plotly"],
        "fetch": [
            {
                "from": "_core",
                "to_folder": "_core",
                "files": ["logic.py", "helpers.py"] 
            },
            {
                "from": "scaling_models/leonard_2014",
                "to_folder": "scaling_models/leonard_2014",
                "files": ["leonard_2014.json"]
            },
            {
                "from": "scaling_models/somerville_2014",
                "to_folder": "scaling_models/somerville_2014",
                "files": ["somerville_2014.json"]
            },
            {
                "from": "scaling_models/wells_coppersmith_1994",
                "to_folder": "scaling_models/wells_coppersmith_1994",
                "files": ["wells_coppersmith_1994.json"]
            },
            {
                "from": "scaling_models/yang_etal_2020",
                "to_folder": "scaling_models/yang_etal_2020",
                "files": ["yang_2020.json"]
            }
        ]
    }
    </script>
</head>
<body>

    <h1>EQ Calculator</h1>

    <!-- TABS NAVIGATION -->
    <div class="tab">
        <button class="tablinks active" onclick="openTab(event, 'Deterministic')">Deterministic</button>
        <button class="tablinks" onclick="openTab(event, 'MonteCarlo')">Monte Carlo</button>
        <button class="tablinks" onclick="openTab(event, 'Explore')">Explore / Plots</button>
    </div>

    <!-- TAB 1: DETERMINISTIC -->
    <div id="Deterministic" class="tabcontent" style="display: block;">
        <div class="card">
            <h3>Calculate Single Value</h3>
            
            <label>Select Model</label>
            <select id="model_select_det" class="model-loader"></select>

            <label>Relationship (Fault Type)</label>
            <select id="fault_select_det"></select>

            <div class="row">
                <div class="col">
                    <label>Input Value</label>
                    <input type="number" id="input_val_det" value="6.5" step="0.1">
                </div>
                <div class="col">
                    <label>Input Unit</label>
                    <select id="input_unit_det">
                        <option value="Mw">Mw</option>
                        <option value="km">km</option>
                        <option value="m">m</option>
                        <option value="m^2">m²</option>
                        <option value="km^2">km²</option>
                    </select>
                </div>
            </div>

            <button class="action-btn" py-click="calculate_deterministic">Calculate</button>
            
            <div id="res_det" class="result-box"></div>
            <div id="err_det" class="error-box"></div>
        </div>
    </div>

    <!-- TAB 2: MONTE CARLO -->
    <div id="MonteCarlo" class="tabcontent">
        <div class="card">
            <h3>Monte Carlo Simulation</h3>
            <p>Run multiple simulations to account for uncertainty.</p>

            <label>Select Model</label>
            <select id="model_select_mc" class="model-loader"></select>
            <label>Relationship</label>
            <select id="fault_select_mc"></select>

            <div class="row">
                <div class="col">
                    <label>Mean Value</label>
                    <input type="number" id="input_val_mc" value="6.5">
                </div>
                <div class="col">
                    <label>Std Dev / Error</label>
                    <input type="number" id="input_unc_mc" value="0.1">
                </div>
            </div>
            
            <label>Number of Simulations</label>
            <input type="number" id="sim_count" value="1000">

            <button class="action-btn" py-click="run_monte_carlo">Run Simulation</button>
            
            <div id="mc_plot_area" style="margin-top: 20px;"></div>
            <div id="err_mc" class="error-box"></div>
        </div>
    </div>

    <!-- TAB 3: EXPLORE -->
    <div id="Explore" class="tabcontent">
        <div class="card">
            <h3>Plot Scaling Curves</h3>
            <label>Select Model</label>
            <select id="model_select_plot" class="model-loader"></select>
            <label>Relationship</label>
            <select id="fault_select_plot"></select>
            
            <button class="action-btn" py-click="plot_curve">Generate Curve</button>
            <div id="curve_plot_area" style="margin-top: 20px;"></div>
        </div>
    </div>

    <!-- JAVASCRIPT FOR TABS -->
    <script>
        function openTab(evt, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tabcontent");
            for (i = 0; i < tabcontent.length; i++) { tabcontent[i].style.display = "none"; }
            tablinks = document.getElementsByClassName("tablinks");
            for (i = 0; i < tablinks.length; i++) { tablinks[i].className = tablinks[i].className.replace(" active", ""); }
            document.getElementById(tabName).style.display = "block";
            evt.currentTarget.className += " active";
        }
    </script>

    <!-- PYTHON LOGIC -->
    <script type="py" config="pyscript-config">
        import json
        import js
        import os
        import numpy as np
        import pandas as pd
        import plotly.express as px
        import plotly.io as pio
        from pyodide.ffi import create_proxy
        
        # IMPORT FROM LOGIC.PY (Assuming you did the rename step)
        from _core.logic import solve_relationship, solve_one_simulation_run, calculate_curve

        # --- LOAD DATA LOGIC ---
        loaded_models = {}
        
        # Mapping Folder Name -> File Name
        model_config = {
            "leonard_2014": "leonard_2014.json",
            "somerville_2014": "somerville_2014.json",
            "wells_coppersmith_1994": "wells_coppersmith_1994.json",
            "yang_etal_2020": "yang_2020.json"
        }

        # Helper to find the actual root key inside the JSON
        def get_model_root(data):
            # If data is { "Leonard 2014": {...} }, return that inner dict
            keys = list(data.keys())
            if len(keys) == 1:
                return data[keys[0]]
            return data

        def load_data():
            # Populate all model dropdowns
            dropdowns = ["model_select_det", "model_select_mc", "model_select_plot"]
            
            for d_id in dropdowns:
                js.document.getElementById(d_id).innerHTML = ""

            found_any = False
            for folder_name, file_name in model_config.items():
                path = f"scaling_models/{folder_name}/{file_name}"
                
                if os.path.exists(path):
                    with open(path, 'r') as f:
                        data = json.load(f)
                    loaded_models[folder_name] = data
                    found_any = True
                    
                    # Add options to all dropdowns
                    for d_id in dropdowns:
                        select = js.document.getElementById(d_id)
                        opt = js.document.createElement("option")
                        opt.text = folder_name.replace("_", " ").title()
                        opt.value = folder_name
                        select.add(opt)
            
            if not found_any:
                js.document.getElementById("err_det").style.display = "block"
                js.document.getElementById("err_det").innerText = "Error: No model files found."
            
            # Trigger initial population
            update_fault_options("model_select_det", "fault_select_det")
            update_fault_options("model_select_mc", "fault_select_mc")
            update_fault_options("model_select_plot", "fault_select_plot")

        def update_fault_options(model_dd_id, fault_dd_id):
            model_name = js.document.getElementById(model_dd_id).value
            fault_select = js.document.getElementById(fault_dd_id)
            fault_select.innerHTML = ""
            
            if model_name in loaded_models:
                data = loaded_models[model_name]
                root = get_model_root(data) # <--- KEY FIX HERE
                
                if 'fault_types' in root:
                    for f_type, rels in root['fault_types'].items():
                        for rel_name in rels.keys():
                            opt = js.document.createElement("option")
                            opt.text = f"{f_type}: {rel_name}"
                            opt.value = f"{f_type}|{rel_name}"
                            fault_select.add(opt)

        # Event Listeners
        def on_det_change(e): update_fault_options("model_select_det", "fault_select_det")
        def on_mc_change(e): update_fault_options("model_select_mc", "fault_select_mc")
        def on_plot_change(e): update_fault_options("model_select_plot", "fault_select_plot")

        js.document.getElementById("model_select_det").addEventListener("change", create_proxy(on_det_change))
        js.document.getElementById("model_select_mc").addEventListener("change", create_proxy(on_mc_change))
        js.document.getElementById("model_select_plot").addEventListener("change", create_proxy(on_plot_change))

        # --- DETERMINISTIC SOLVER ---
        def calculate_deterministic(e):
            try:
                model = js.document.getElementById("model_select_det").value
                sel = js.document.getElementById("fault_select_det").value
                val = float(js.document.getElementById("input_val_det").value)
                unit = js.document.getElementById("input_unit_det").value
                
                f_type, rel = sel.split("|")
                data = loaded_models[model]
                root = get_model_root(data) # <--- KEY FIX HERE
                params = root['fault_types'][f_type][rel]
                
                # Heuristic Direction Logic
                # If the unit the user selected matches the X unit of the model, it's forward.
                # Otherwise, assume inverse.
                first_seg = params[0]
                model_x_unit = first_seg.get('units', {}).get('x', '')
                
                # Check mapping (e.g. m^2 vs km^2)
                direction = 'forward'
                if unit == model_x_unit:
                    direction = 'forward'
                elif 'Mw' in rel and unit == 'Mw': # Special case for Magnitude
                     direction = 'inverse' if rel.startswith('Mw') else 'forward'
                elif unit != model_x_unit:
                    direction = 'inverse'

                res, res_unit = solve_relationship(params, val, unit, direction)
                
                out_div = js.document.getElementById("res_det")
                out_div.style.display = "block"
                out_div.innerText = f"Result: {res:.4f} {res_unit}"
                js.document.getElementById("err_det").style.display = "none"
            except Exception as ex:
                js.document.getElementById("err_det").style.display = "block"
                js.document.getElementById("err_det").innerText = str(ex)

        # --- MONTE CARLO SOLVER ---
        def run_monte_carlo(e):
            try:
                model = js.document.getElementById("model_select_mc").value
                sel = js.document.getElementById("fault_select_mc").value
                mean = float(js.document.getElementById("input_val_mc").value)
                std = float(js.document.getElementById("input_unc_mc").value)
                sims = int(js.document.getElementById("sim_count").value)
                
                f_type, rel = sel.split("|")
                data = loaded_models[model]
                root = get_model_root(data)
                params = root['fault_types'][f_type][rel]
                
                results = []
                for _ in range(sims):
                    iter_val = np.random.normal(mean, std)
                    # For simplicity in this demo, assuming Forward / Mw
                    # You might need to add direction logic here too similar to above
                    res, u = solve_one_simulation_run(params, iter_val, "Mw", "forward", True)
                    if res: results.append(res)
                
                df = pd.DataFrame({'Result': results})
                fig = px.histogram(df, x='Result', nbins=30, title="Monte Carlo Distribution")
                
                graphJSON = json.dumps(fig.to_dict(), cls=pio.utils.PlotlyJSONEncoder)
                js.Plotly.newPlot("mc_plot_area", js.JSON.parse(graphJSON))
                js.document.getElementById("err_mc").style.display = "none"
                
            except Exception as ex:
                js.document.getElementById("err_mc").style.display = "block"
                js.document.getElementById("err_mc").innerText = str(ex)

        # --- PLOTTING SOLVER ---
        def plot_curve(e):
            try:
                model = js.document.getElementById("model_select_plot").value
                sel = js.document.getElementById("fault_select_plot").value
                f_type, rel = sel.split("|")
                
                data = loaded_models[model]
                root = get_model_root(data)
                params = root['fault_types'][f_type][rel]
                
                x_vals = np.linspace(4.0, 9.0, 50)
                y_vals, y_unit = calculate_curve(params, x_vals, "Mw", "forward")
                
                df = pd.DataFrame({'Mw': x_vals, 'Result': y_vals})
                fig = px.line(df, x='Mw', y='Result', title=f"{rel} Scaling Curve")
                
                graphJSON = json.dumps(fig.to_dict(), cls=pio.utils.PlotlyJSONEncoder)
                js.Plotly.newPlot("curve_plot_area", js.JSON.parse(graphJSON))
            except Exception as ex:
                js.alert(str(ex))

        # Initial Load
        load_data()

    </script>
</body>
</html>
